
name: Build Nexora APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Descomprimir Nexora
        run: unzip -q Nexora-Android-Project.zip -d source

      - name: Compilar APK
        run: gradle --no-daemon assembleDebug
        working-directory: source/Nexora

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexora-debug-apk
          path: source/Nexora/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
