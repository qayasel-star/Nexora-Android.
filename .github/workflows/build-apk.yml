
name: Build Nexora APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Nexora source ZIP
        run: unzip -q Nexora-Android-Project-v4.zip -d source

      - name: Calculate version from workflow run
        id: version
        shell: bash
        run: |
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "name=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Build versioned APK
        working-directory: source/Nexora
        run: |
          gradle --no-daemon assembleDebug \
            -PversionCode=${{ steps.version.outputs.code }} \
            -PversionName=${{ steps.version.outputs.name }}

      - name: Rename APK
        run: |
          cp "source/Nexora/app/build/outputs/apk/debug/app-debug.apk" \
             "Nexora-${{ steps.version.outputs.name }}-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nexora-${{ steps.version.outputs.name }}-apk
          path: Nexora-${{ steps.version.outputs.name }}-debug.apk
          if-no-files-found: error
          retention-days: 30
          
