
name: Build Nexora APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Aceptar licencias de Android
        run: yes | sdkmanager --licenses || true

      - name: Instalar componentes Android
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Localizar proyecto Android
        id: project
        shell: bash
        run: |
          if [ -f "app/build.gradle" ] || [ -f "app/build.gradle.kts" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f "Nexora/app/build.gradle" ] || [ -f "Nexora/app/build.gradle.kts" ]; then
            echo "dir=Nexora" >> "$GITHUB_OUTPUT"
          else
            echo "ERROR: No se encontró app/build.gradle."
            echo "Contenido del repositorio:"
            ls -la
            exit 1
          fi

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        shell: bash
        run: |
          cd "${{ steps.project.outputs.dir }}"

          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Publicar APK generado
        uses: actions/upload-artifact@v4
        with:
          name: Nexora-debug-apk
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
