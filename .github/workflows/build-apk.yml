name: Build Nexora APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: Accept Android SDK licenses
        run: set +o pipefail; yes | sdkmanager --licenses

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify Nexora ZIP
        run: test -f Nexora-Android-Project-v4-actualizado.zip

      - name: Extract Nexora source
        run: unzip -q Nexora-Android-Project-v4-actualizado.zip -d source

      - name: Build Nexora APK
        working-directory: source/Nexora
        run: gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nexora-debug-apk
          path: source/Nexora/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
