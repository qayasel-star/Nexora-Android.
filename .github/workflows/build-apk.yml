
name: Build Nexora APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Check ZIP
        run: ls -la

      - name: Extract project
        run: unzip -q Nexora-Android-Project-v3.zip -d source

      - name: Inspect project
        run: find source -maxdepth 4 -type f | head -100

      - name: Build APK
        run: gradle --no-daemon assembleDebug
        working-directory: source/Nexora

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexora-debug-apk
          path: source/Nexora/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
