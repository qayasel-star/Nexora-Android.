
name: Build Nexora APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Compilar NEXORA
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          packages: platform-tools

      - name: Aceptar licencias Android
        shell: bash
        run: |
          set -e
          set +o pipefail
          yes | sdkmanager --licenses
          set -o pipefail

      - name: Instalar componentes Android
        shell: bash
        run: |
          set -e
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Aceptar licencias de los componentes
        shell: bash
        run: |
          set -e
          set +o pipefail
          yes | sdkmanager --licenses
          set -o pipefail

      - name: Localizar proyecto NEXORA
        id: project
        shell: bash
        run: |
          set -e

          if [ -f "app/build.gradle" ] || [ -f "app/build.gradle.kts" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f "Nexora/app/build.gradle" ] || [ -f "Nexora/app/build.gradle.kts" ]; then
            echo "dir=Nexora" >> "$GITHUB_OUTPUT"
          else
            echo "ERROR: No se encontro el proyecto Android."
            echo "Contenido del repositorio:"
            ls -la
            find . -maxdepth 4 \
              \( -name build.gradle -o -name build.gradle.kts \) \
              -print
            exit 1
          fi

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK de NEXORA
        shell: bash
        run: |
          set -e
          cd "${{ steps.project.outputs.dir }}"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Verificar APK generado
        shell: bash
        run: |
          set -e

          APK="${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: No se encontro el APK esperado."
            echo "Archivos APK encontrados:"
            find "${{ steps.project.outputs.dir }}" \
              -type f -name "*.apk" -print
            exit 1
          fi

          echo "APK generado correctamente:"
          ls -lh "$APK"

      - name: Publicar APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: Nexora-debug-apk
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
