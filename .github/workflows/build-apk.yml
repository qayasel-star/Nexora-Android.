
name: Build Nexora APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Compilar NEXORA
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          packages: platform-tools

      - name: Aceptar licencias Android
        shell: bash
        run: |
          set -e
          set +o pipefail
          yes | sdkmanager --licenses
          set -o pipefail

      - name: Instalar componentes Android
        shell: bash
        run: |
          set -e
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Descomprimir proyecto NEXORA
        shell: bash
        run: |
          set -e

          ZIP="Nexora-Android-Project-v4-notificaciones-auditado-1.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: No se encontro el ZIP esperado: $ZIP"
            echo "ZIP disponibles en el repositorio:"
            find . -maxdepth 2 -type f -iname "*.zip" -print
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/nexora_extracted"
          unzip -o "$ZIP" -d "$GITHUB_WORKSPACE/nexora_extracted"

          echo "Contenido descomprimido:"
          find "$GITHUB_WORKSPACE/nexora_extracted" \
            -maxdepth 4 -type f \
            \( -name "build.gradle" -o -name "build.gradle.kts" \) \
            -print

      - name: Localizar proyecto Android
        id: project
        shell: bash
        run: |
          set -e

          ROOT="$GITHUB_WORKSPACE/nexora_extracted"
          PROJECT=""

          while IFS= read -r FILE; do
            case "$FILE" in
              */app/build.gradle|*/app/build.gradle.kts)
                PROJECT="$(dirname "$(dirname "$FILE")")"
                break
                ;;
            esac
          done < <(
            find "$ROOT" -type f \
              \( -path "*/app/build.gradle" \
              -o -path "*/app/build.gradle.kts" \) \
              -print
          )

          if [ -z "$PROJECT" ]; then
            echo "ERROR: No se encontro el modulo Android app."
            echo "Archivos encontrados:"
            find "$ROOT" -maxdepth 6 -type f -print
            exit 1
          fi

          echo "Proyecto encontrado en: $PROJECT"
          echo "dir=$PROJECT" >> "$GITHUB_OUTPUT"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK de NEXORA
        shell: bash
        run: |
          set -e
          cd "${{ steps.project.outputs.dir }}"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          elif [ -f "../gradlew" ]; then
            chmod +x ../gradlew
            ../gradlew --no-daemon -p . assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Buscar APK generado
        id: apk
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.project.outputs.dir }}"
          APK="$PROJECT/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: No se encontro el APK esperado."
            echo "Buscando APK alternativos..."
            find "$GITHUB_WORKSPACE/nexora_extracted" \
              -type f -name "*.apk" -print
            exit 1
          fi

          echo "Archivo APK encontrado:"
          ls -lh "$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Publicar APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: Nexora-debug-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30
